name: Build and Publish Docker Images

on:
  workflow_run:
    workflows: ["Version Bump"]
    types: [completed]
  push:
    tags: ['v*']
  workflow_dispatch:

# Cancel in-progress runs for the same branch — saves runner minutes.
concurrency:
  group: docker-build-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Only run when version-bump succeeded, or on manual/tag triggers
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: .
            image-suffix: -backend
          - name: frontend
            context: ./apps/frontend
            image-suffix: -frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Build from the newest v* tag, whatever branch pushed it. The
          # semver metadata patterns below need the tag context.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release version from the tag
        id: release
        run: |
          # Highest semantic v* tag — NOT `git describe`, which resolves the
          # nearest tag reachable from the checked-out master commit and can
          # silently build the previous release when master lags the new tag
          # (workflow_run races the mirror).
          VERSION=$(git tag --list 'v*' --sort=-v:refname | head -n1 | sed 's/^v//')
          if [ -z "$VERSION" ]; then echo "No v* tag found"; exit 1; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Build exactly the release commit, not whatever master points at.
          git checkout --detach "v${VERSION}"
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "Building v${VERSION} from $(git rev-parse --short HEAD)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for ${{ matrix.name }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.image-suffix }}
          tags: |
            type=sha
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.major_minor }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
