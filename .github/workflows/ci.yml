name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      SESSION_KEYS: ci-test-key-for-config-loading
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Run ESLint
        run: npm run lint

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci

      # Frontend lint is a deliberate placeholder that exits 0: typescript-eslint
      # does not support TypeScript >=7 yet (typescript-eslint#10940). The script
      # prints the reason on every run. Re-enable when support ships.
      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint

      - name: Test frontend
        working-directory: apps/frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build
