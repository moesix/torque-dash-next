server {
    listen 8080;
    server_name _;

    # HSTS: enforce HTTPS for one year, including all subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls (and any WebSocket upgrades) to the backend service.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $forwarded_proto $scheme;
        if ($http_x_forwarded_proto) { set $forwarded_proto $http_x_forwarded_proto; }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # SSE support: disable buffering so EventSource/ReadableStream works.
        proxy_buffering off;
        proxy_cache off;
        # Long AI analyses stream silently between LLM tokens; keep the proxy
        # ceiling ABOVE the backend's 90s inactivity guard (plans/084) so the
        # backend's clean SSE error event always wins the race. 120s only
        # catches a dead backend process.
        proxy_read_timeout 120s;
        proxy_connect_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # SPA history fallback so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
