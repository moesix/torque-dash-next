server {
    listen 8080;
    server_name _;

    # HSTS: enforce HTTPS for one year, including all subdomains
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Edge security headers for the session-bearing SPA document.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # Vite emits one external module script and no inline script/style in
    # index.html, so script-src needs no 'unsafe-inline'. style-src keeps it for
    # runtime style attributes (Leaflet/ECharts). Tiles are <img> (img-src https:).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls (and any WebSocket upgrades) to the backend service.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support: disable buffering so EventSource/ReadableStream works.
        proxy_buffering off;
        proxy_cache off;
        # Long AI analyses stream silently between LLM tokens; keep the proxy
        # ceiling ABOVE the backend's 90s inactivity guard (plans/084) so the
        # backend's clean SSE error event always wins the race. 120s only
        # catches a dead backend process.
        proxy_read_timeout 120s;
        proxy_connect_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # SPA history fallback so client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
